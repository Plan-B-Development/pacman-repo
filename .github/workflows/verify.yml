name: Verify install path

# Proves the published repositories actually work, from a clean machine, using
# exactly the commands README.md gives users: pacman on Arch (and bootstrap.sh),
# APT on Debian 13 and Ubuntu 26.04, DNF on Fedora 44, and the signed update
# manifest. Nothing else in this project tests the thing users actually do — a
# broken database, an unsigned package, a symlinked .db, or an untrusted key all
# produce a perfectly green publish run and a repository nobody can install from.
#
# Runs after every publish, and on a daily schedule. The schedule matters: these
# repositories can break without anyone touching them (an expired signing key, a
# deleted release asset, a GitHub storage change), and the failure would
# otherwise first surface as a user's upgrade breaking. Every leg also fails when
# what it is served is not the latest Release: the staleness alarm.

on:
  workflow_run:
    workflows: [Publish package repositories]
    types: [completed]
  workflow_dispatch:
  schedule:
    # 07:00 UTC daily.
    - cron: '0 7 * * *'

permissions:
  contents: read

# Deliberately the SAME group as `Publish package repositories`, so verification can
# never run while a publish is rewriting the release assets. `gh release upload
# --clobber` deletes an asset before re-uploading it, so during a publish the
# database and its signature genuinely 404 for a moment. Observed 2026-08-05: a
# simultaneous GUI + daemon release ran this workflow (chained off the first
# publish) straight through the second publish's upload window, and it failed on
# `failed retrieving file 'control-ofc.db.sig' ... 404` against a repository that
# was perfectly healthy.
#
# That costs more than one red tick. This workflow is the staleness alarm for a
# dead notify token or a failed publish, and an alarm that cries wolf on every
# dual release is one nobody reads — which is exactly how a broken
# PACMAN_REPO_TOKEN went unnoticed for a day.
#
# `cancel-in-progress: false` is safe on both sides: publishing is declarative
# (every run rebuilds the whole database from the current latest releases), so a
# superseded pending run being dropped loses nothing, and a queued publish simply
# waits out a verify rather than racing it.
concurrency:
  group: publish-pacman-repo
  cancel-in-progress: false

env:
  SIGNING_KEY: 4AAD6D2DE40D0D10773BF770BC27C5EB2831FCDA
  # Every section the repository serves: publish.yml's REPO_NAMES, and the
  # `verify` matrix below (which cannot read env). `fingerprint` checks all three
  # agree, so ending the [control-ofc] alias in one place cannot leave this
  # workflow red against a database that was meant to be gone.
  SECTIONS: ventulus control-ofc
  APT_URI: https://github.com/Plan-B-Development/pacman-repo/releases/download/repo/
  PAGES_URL: https://plan-b-development.github.io/pacman-repo
  KEY_URL: https://raw.githubusercontent.com/Plan-B-Development/pacman-repo/main/keys/ventulus.gpg
  # GitHub serves a replaced release asset stale for ~90–150 s per URL (DEC-499
  # phase 0), and Pages caches for up to 600 s. A leg chained straight off a
  # publish polls until what it sees is consistent and current, for at most
  # this long; on the daily schedule the first poll passes.
  SETTLE_SECONDS: 900

jobs:
  # The latest stable Release of each project: what every leg must be serving.
  upstream:
    name: Latest upstream versions
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      ventulusd: ${{ steps.v.outputs.ventulusd }}
      ventulus: ${{ steps.v.outputs.ventulus }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for p in ventulusd ventulus; do
            tag=$(gh release view --repo "Plan-B-Development/$p" --json tagName -q .tagName)
            echo "$p=${tag#v}" | tee -a "$GITHUB_OUTPUT"
          done

  # README § Debian and Ubuntu, in a clean container of each supported release.
  apt:
    name: Clean-machine install (APT, ${{ matrix.image }})
    needs: upstream
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:13', 'ubuntu:26.04']
    env:
      DEBIAN_FRONTEND: noninteractive
      WANT_D: ${{ needs.upstream.outputs.ventulusd }}
      WANT_G: ${{ needs.upstream.outputs.ventulus }}
    steps:
      - name: Trust the signing key as README says
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gpg > /dev/null
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL "$KEY_URL" | tee /etc/apt/keyrings/ventulus.asc > /dev/null
          fpr=$(gpg --show-keys --with-colons /etc/apt/keyrings/ventulus.asc | awk -F: '/^fpr:/ {print $10; exit}')
          [ "$fpr" = "$SIGNING_KEY" ] \
            || { echo "::error::the key at $KEY_URL is $fpr, not $SIGNING_KEY"; exit 1; }

      - name: Add the repository
        run: |
          set -euo pipefail
          printf '%s\n' 'Types: deb' \
            "URIs: $APT_URI" \
            'Suites: ./' \
            'Signed-By: /etc/apt/keyrings/ventulus.asc' \
            | tee /etc/apt/sources.list.d/ventulus.sources

      # Signed-By holds only the repository key, so a clean update is the
      # InRelease signature verifying, and the Packages hashes matching it.
      - name: apt update is clean and serves the latest Releases
        run: |
          set -euo pipefail
          deadline=$((SECONDS + SETTLE_SECONDS))
          while :; do
            if apt-get update > /tmp/update.log 2>&1 && ! grep -qE '^(W|E|Warning|Error):' /tmp/update.log; then
              d=$(apt-cache policy ventulusd | awk '/Candidate:/ {print $2}')
              g=$(apt-cache policy ventulus | awk '/Candidate:/ {print $2}')
              [ "${d%-*}" = "$WANT_D" ] && [ "${g%-*}" = "$WANT_G" ] && break
              why="it serves ventulusd ${d} and ventulus ${g}; the latest Releases are ${WANT_D} and ${WANT_G}"
            else
              why="apt-get update is not clean: $(grep -E '^(W|E|Warning|Error):' /tmp/update.log | head -3 | tr '\n' ' ')"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat /tmp/update.log
              echo "::error::after ${SETTLE_SECONDS}s, ${why}. A stale version means the publish workflow has not run for a release — check notify-repo in the source repo and the PACMAN_REPO_TOKEN secret."
              exit 1
            fi
            echo "waiting: $why"
            sleep 15
          done
          echo "ok: apt serves ventulusd $d and ventulus $g"

      - name: Install the GUI, which pulls in the daemon
        run: |
          set -euo pipefail
          apt-get install -y -q ventulus
          for p in ventulus ventulusd; do
            dpkg-query -W -f '${Package} ${Version} ${db:Status-Status}\n' "$p" | tee /tmp/q
            grep -q ' installed$' /tmp/q || { echo "::error::$p is not installed"; exit 1; }
          done
          ventulusd --version

  # README § Fedora, in a clean container of each Fedora release served. Add a
  # release here when the GUI Release gains its .fcN.rpm.
  dnf:
    name: Clean-machine install (DNF, ${{ matrix.image }})
    needs: upstream
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44']
    env:
      WANT_D: ${{ needs.upstream.outputs.ventulusd }}
      WANT_G: ${{ needs.upstream.outputs.ventulus }}
    steps:
      - name: Add the repository as README says
        run: |
          set -euo pipefail
          command -v curl > /dev/null || dnf -y -q install curl
          curl -fsSL "$PAGES_URL/ventulus.repo" | tee /etc/yum.repos.d/ventulus.repo
          # Every check below rests on these lines; without them dnf would take
          # unsigned metadata or packages and the install would still pass.
          for line in gpgcheck=1 repo_gpgcheck=1 "gpgkey=$KEY_URL"; do
            grep -qxF "$line" /etc/yum.repos.d/ventulus.repo \
              || { echo "::error::the served ventulus.repo lacks '$line'"; exit 1; }
          done

      # The metadata signature, checked directly against the published key, not
      # only through dnf's repo_gpgcheck.
      - name: repomd.xml is signed by the repository key
        run: |
          set -euo pipefail
          if ! command -v gpg > /dev/null || ! command -v gpgv > /dev/null; then
            dnf -y -q install gnupg2 gnupg2-verify
          fi
          rel=$(rpm -E %fedora)
          base="$PAGES_URL/rpm/fedora/$rel/x86_64/repodata"
          curl -fsSL "$KEY_URL" | gpg --dearmor > /tmp/keyring.gpg
          deadline=$((SECONDS + SETTLE_SECONDS))
          while :; do
            if curl -fsS -o /tmp/repomd.xml "$base/repomd.xml" && curl -fsS -o /tmp/repomd.xml.asc "$base/repomd.xml.asc"; then
              signer=$(gpgv --status-fd 1 --keyring /tmp/keyring.gpg /tmp/repomd.xml.asc /tmp/repomd.xml 2>/dev/null \
                         | awk '$2 == "VALIDSIG" {print $NF}' || true)
              [ "$signer" = "$SIGNING_KEY" ] && break
              why="repomd.xml.asc does not verify as $SIGNING_KEY"
            else
              why="repomd.xml or its signature is not served for Fedora $rel"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::after ${SETTLE_SECONDS}s, ${why}"
              exit 1
            fi
            echo "waiting: $why"
            sleep 15
          done
          echo "ok: Fedora $rel repomd.xml verifies as $SIGNING_KEY"

      # dnf5 rejects a bad repomd.xml signature only quietly: `makecache` prints
      # the error and exits 0, and the metadata is discarded (DEC-499 phase 0).
      # So this asks repoquery what the repository offers; with a bad signature
      # it offers nothing.
      - name: The signed metadata serves the latest Releases
        run: |
          set -euo pipefail
          deadline=$((SECONDS + SETTLE_SECONDS))
          while :; do
            # -y: the first metadata load imports the key, which asks first.
            dnf -y -q --refresh --repo ventulus repoquery --latest-limit 1 \
                --qf '%{name} %{version}\n' ventulusd ventulus < /dev/null > /tmp/offer.txt 2> /tmp/dnf.log || true
            d=$(awk '$1 == "ventulusd" {print $2}' /tmp/offer.txt)
            g=$(awk '$1 == "ventulus" {print $2}' /tmp/offer.txt)
            [ "$d" = "$WANT_D" ] && [ "$g" = "$WANT_G" ] && break
            why="the repository offers ventulusd '${d}' and ventulus '${g}'; the latest Releases are ${WANT_D} and ${WANT_G}"
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat /tmp/dnf.log
              echo "::error::after ${SETTLE_SECONDS}s, ${why}. Nothing offered at all means the metadata was refused (check the signature lines above) or Pages is not deployed."
              exit 1
            fi
            echo "waiting: $why"
            sleep 15
          done
          echo "ok: dnf offers ventulusd $d and ventulus $g"

      - name: Install the GUI, which pulls in the daemon
        run: |
          set -euo pipefail
          dnf -y install ventulus
          key=$(echo "$SIGNING_KEY" | tr 'A-F' 'a-f')
          rpm -q gpg-pubkey --qf '%{version} %{summary}\n' | tee /tmp/keys.txt
          grep -q "^${key} \|^${key: -8} " /tmp/keys.txt \
            || { echo "::error::dnf did not import the repository key $SIGNING_KEY"; exit 1; }
          for p in ventulus ventulusd; do
            rpm -q "$p"
            sig=$(rpm -q --qf '%{OPENPGP:pgpsig}' "$p")
            case "$sig" in
              *"Key ID ${key: -16}"*) echo "ok: $p signed: $sig" ;;
              *) echo "::error::$p is not signed by $SIGNING_KEY: $sig"; exit 1 ;;
            esac
            from=$(dnf -q repoquery --installed --qf '%{from_repo}\n' "$p")
            [ "$from" = ventulus ] || { echo "::error::$p came from '$from', not [ventulus]"; exit 1; }
          done
          ventulusd --version

  # The manifest the GUI's update check reads (README § Update manifest): its
  # signature against the key the GUI ships (this checkout's keys/ventulus.gpg),
  # and its contents against the Releases themselves.
  manifest:
    name: Update manifest is signed and current
    needs: upstream
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WANT_D: ${{ needs.upstream.outputs.ventulusd }}
      WANT_G: ${{ needs.upstream.outputs.ventulus }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The signature verifies and the versions are current
        run: |
          set -euo pipefail
          gpg --dearmor < keys/ventulus.gpg > /tmp/keyring.gpg
          deadline=$((SECONDS + SETTLE_SECONDS))
          while :; do
            why=''
            curl -fsS -o /tmp/m.json "$PAGES_URL/ventulus-updates.json" \
              && curl -fsS -o /tmp/m.json.sig "$PAGES_URL/ventulus-updates.json.sig" \
              || why='the manifest or its signature is not served'
            if [ -z "$why" ]; then
              status=$(gpgv --status-fd 1 --keyring /tmp/keyring.gpg /tmp/m.json.sig /tmp/m.json 2>/dev/null || true)
              signer=$(awk '$2 == "VALIDSIG" {print $NF}' <<< "$status")
              if [ "$signer" != "$SIGNING_KEY" ]; then
                why="the signature does not verify as $SIGNING_KEY"
              else
                d=$(jq -r '.components.ventulusd.version' /tmp/m.json)
                g=$(jq -r '.components.ventulus.version' /tmp/m.json)
                [ "$d" = "$WANT_D" ] && [ "$g" = "$WANT_G" ] && break
                why="it announces ventulusd ${d} and ventulus ${g}; the latest Releases are ${WANT_D} and ${WANT_G}"
              fi
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::after ${SETTLE_SECONDS}s, ${why}"
              exit 1
            fi
            echo "waiting: $why"
            sleep 15
          done
          echo "ok: the manifest verifies and announces ventulusd $d and ventulus $g"

      - name: Its contents match the Releases
        run: |
          set -euo pipefail
          jq -e '.schema == 1' /tmp/m.json > /dev/null || { echo "::error::schema is not 1"; exit 1; }
          fail=0
          for p in ventulusd ventulus; do
            tag=$(jq -r ".components.${p}.tag" /tmp/m.json)
            mkdir -p "/tmp/$p"
            gh release download "$tag" --repo "Plan-B-Development/$p" --pattern SHA256SUMS --dir "/tmp/$p" --clobber
            # name + sha256 of every asset, as the manifest lists them and as the
            # Release's SHA256SUMS does: exactly the same set.
            jq -r ".components.${p}.assets[] | \"\(.sha256)  \(.name)\"" /tmp/m.json | sort > "/tmp/$p/manifest.txt"
            sort "/tmp/$p/SHA256SUMS" > "/tmp/$p/release.txt"
            if ! diff -u "/tmp/$p/release.txt" "/tmp/$p/manifest.txt"; then
              echo "::error::$p: the manifest's assets differ from the Release's SHA256SUMS"
              fail=1
            fi
            jq -r ".components.${p}.assets[] | \"\(.name) \(.url)\"" /tmp/m.json \
              | while read -r name url; do
                  [ "$url" = "https://github.com/Plan-B-Development/$p/releases/download/$tag/$name" ] \
                    || { echo "::error::$p: $name has the URL $url"; exit 1; }
                done || fail=1
          done
          min=$(jq -r '.components.ventulus.daemon_minimum' /tmp/m.json)
          [ "$(printf '%s\n%s\n' "$min" "$WANT_D" | sort -V | head -1)" = "$min" ] \
            || { echo "::error::the GUI needs ventulusd >= $min, but the latest daemon is $WANT_D"; fail=1; }
          jq -e '.components.ventulusd.api_version | type == "number" and . >= 1' /tmp/m.json > /dev/null \
            || { echo "::error::api_version is missing or not a positive number"; fail=1; }
          [ "$fail" -eq 0 ] && echo "ok: every asset, daemon_minimum $min and api_version match"
          exit "$fail"

  verify:
    name: Clean-machine install ([${{ matrix.section }}])
    runs-on: ubuntu-latest
    container: archlinux:latest
    # Do not chase a publish that already failed.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # `ventulus` is the repository; `control-ofc` is the same packages under the
    # old section name, kept so existing pacman.conf files keep upgrading (see
    # publish.yml). Each is installed exactly as its users configured it.
    strategy:
      fail-fast: false
      matrix:
        section: [ventulus, control-ofc]
    env:
      SECTION: ${{ matrix.section }}
    steps:
      - name: Prepare a clean pacman keyring
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed curl
          pacman-key --init
          pacman-key --populate archlinux

      # Deliberately fetched over raw.githubusercontent, exactly as README.md
      # tells users to — so this step fails if that URL ever stops serving the
      # key, which is a documented install step breaking. Each section fetches
      # the key file its own instructions name.
      - name: Trust the repository signing key
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/keys/${SECTION}.gpg" \
            | pacman-key --add -
          pacman-key --lsign-key "$SIGNING_KEY"

      - name: Add the repository
        run: |
          set -euo pipefail
          cat >> /etc/pacman.conf <<EOF

          [${SECTION}]
          SigLevel = Required
          Server = https://github.com/${GITHUB_REPOSITORY}/releases/download/repo
          EOF
          tail -5 /etc/pacman.conf

      # `-Sy` against only this repo: it must serve a database that parses AND
      # whose signature verifies against the key trusted above. SigLevel=Required
      # makes an unsigned or wrongly-signed DB a hard failure here.
      - name: Sync the database
        run: pacman -Sy --noconfirm

      - name: Both packages are visible and resolvable
        run: |
          set -euo pipefail
          pacman -Sl "$SECTION"
          for pkg in ventulusd ventulus; do
            pacman -Si "${SECTION}/$pkg" > /dev/null
            echo "ok: $pkg is in [${SECTION}]"
          done

      # What carries a Control-OFC install across on its next `pacman -Syu`. If
      # a package lost its replaces=, old installs would silently stop upgrading.
      - name: The packages replace their Control-OFC names
        run: |
          set -euo pipefail
          for pair in ventulusd:control-ofc-daemon ventulus:control-ofc-gui; do
            pkg=${pair%%:*} old=${pair#*:}
            pacman -Si "${SECTION}/$pkg" | grep -E '^Replaces' | grep -qw -- "$old" \
              || { echo "::error::${pkg} no longer replaces ${old}"; exit 1; }
            echo "ok: $pkg replaces $old"
          done

      # The real test: download and signature-check the packages. This exercises
      # the per-package `.sig` sibling fetch, which is the part that silently
      # fails if a package was uploaded without its signature.
      # The state a user mid-migration is in: the new section added while the old
      # one is still there. Both serve the same packages; pacman must still sync
      # and resolve the install. Run once, from the first leg.
      - name: Every section configured together still resolves
        if: matrix.section == 'ventulus'
        run: |
          set -euo pipefail
          for other in $SECTIONS; do
            [ "$other" = "$SECTION" ] && continue
            printf '\n[%s]\nSigLevel = Required\nServer = https://github.com/%s/releases/download/repo\n' \
              "$other" "$GITHUB_REPOSITORY" >> /etc/pacman.conf
          done
          pacman -Sy --noconfirm
          pacman -S --print --noconfirm ventulus | tee /tmp/plan-all.txt
          grep -q 'ventulusd' /tmp/plan-all.txt \
            || { echo "::error::with every section configured, ventulus did not pull in ventulusd"; exit 1; }

      - name: Download and verify the packages
        run: |
          set -euo pipefail
          pacman -Sw --noconfirm ventulus
          ls -l /var/cache/pacman/pkg/

      # The GUI depends on ventulusd>=X, so a successful dependency resolution
      # also proves the daemon in the repo satisfies the GUI's floor — catching a
      # repo that serves a mismatched pair.
      - name: Dependency resolution matches the documented install
        run: |
          set -euo pipefail
          pacman -S --print --noconfirm ventulus | tee /tmp/plan.txt
          grep -q 'ventulusd' /tmp/plan.txt \
            || { echo "::error::ventulus did not pull in ventulusd"; exit 1; }

      # Staleness alarm. Everything above passes just as happily against a
      # repository frozen ten versions ago — an install that works is not an
      # install that is current. This is the check that catches a publish that
      # never ran: a failed `notify-repo`, an expired PACMAN_REPO_TOKEN, or a
      # dispatch that was silently dropped. On the daily schedule it is the only
      # thing standing between a broken notify and users quietly stopping at an
      # old version.
      - name: Repository is not stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed github-cli
          stale=0
          for pkg in ventulusd ventulus; do
            upstream=$(gh release view --repo "Plan-B-Development/$pkg" \
                         --json tagName -q '.tagName' | sed 's/^v//')
            served=$(pacman -Si "${SECTION}/$pkg" \
                       | awk '/^Version/ {print $3}' | sed 's/-[0-9]*$//')
            if [ "$upstream" != "$served" ]; then
              echo "::error::${pkg}: [${SECTION}] serves ${served} but the latest release is ${upstream}. The publish workflow has not run for this release — check notify-repo in the source repo and the PACMAN_REPO_TOKEN secret."
              stale=1
            else
              echo "ok: ${pkg} ${served} matches the latest release"
            fi
          done
          exit "$stale"

      - name: Summary
        run: |
          {
            echo "### Clean-machine install verified ([${SECTION}])"
            echo "- key trusted from raw.githubusercontent (keys/${SECTION}.gpg)"
            echo "- database signature verified (SigLevel = Required)"
            echo "- both packages downloaded and signature-checked"
            echo "- both packages replace their Control-OFC names"
            echo "- served versions match the latest upstream releases"
          } >> "$GITHUB_STEP_SUMMARY"

  # The job above verifies README Option B — the manual, copy-paste install. It
  # does NOT touch bootstrap.sh, which is the path README.md recommends FIRST.
  # So the recommended install path was the one nothing tested, while the
  # fallback was covered. This job closes that.
  bootstrap:
    name: Clean-machine install via bootstrap.sh
    runs-on: ubuntu-latest
    container: archlinux:latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare a clean machine
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed curl
          pacman-key --init
          pacman-key --populate archlinux

      # bootstrap.sh is DELIBERATELY unsuitable for unattended use: its final
      # install step is interactive on purpose, so a user sees and agrees to a
      # transaction that may upgrade far more than Ventulus. That property is
      # worth keeping, so CI drives the script from outside rather than adding an
      # --unattended flag to it. Two PATH shims, no edit to the script:
      #
      #   pacman    — appends --noconfirm (accepted on every operation)
      #   systemctl — absent in a container; is-enabled/is-active return 1 so the
      #               script takes its `enable --now` branch, which then no-ops
      #
      # /usr/local/bin precedes /usr/bin, and the script runs as root so its
      # $SUDO is empty — meaning these shims are what it actually calls.
      #
      # The script refuses a machine not booted with systemd, and tests that by
      # /run/systemd/system, which a container lacks. Creating it is the third
      # piece of driving from outside; `bootstrap-refuses` covers the refusal.
      - name: Install non-interactive shims
        run: |
          set -euo pipefail
          mkdir -p /run/systemd/system
          cat > /usr/local/bin/pacman <<'SHIM'
          #!/bin/sh
          exec /usr/bin/pacman "$@" --noconfirm
          SHIM
          cat > /usr/local/bin/systemctl <<'SHIM'
          #!/bin/sh
          case "${1:-}" in
            is-enabled|is-active) exit 1 ;;
            *) echo "[ci-shim] systemctl $*"; exit 0 ;;
          esac
          SHIM
          chmod +x /usr/local/bin/pacman /usr/local/bin/systemctl

      # gh is deliberately NOT installed. The script's Sigstore provenance check
      # is optional-by-design and skips when gh is missing or unauthenticated —
      # which is the state a genuinely fresh machine is in. Running it that way
      # exercises the documented fallback rather than a path most users never hit.
      - name: Run bootstrap.sh end to end
        run: |
          set -euo pipefail
          chmod +x ./bootstrap.sh
          ./bootstrap.sh | tee /tmp/bootstrap.out
          grep -q 'supported — continuing' /tmp/bootstrap.out \
            || { echo "::error::bootstrap.sh did not report Arch x86_64 with systemd as supported"; exit 1; }

      - name: Both packages are actually installed
        run: |
          set -euo pipefail
          for pkg in ventulusd ventulus; do
            /usr/bin/pacman -Qi "$pkg" > /dev/null \
              || { echo "::error::bootstrap.sh finished but $pkg is not installed"; exit 1; }
            echo "ok: $pkg installed"
          done
          grep -q '^\[ventulus\]' /etc/pacman.conf \
            || { echo "::error::bootstrap.sh did not add the [ventulus] section"; exit 1; }

      # Idempotence is a documented property of the script (the old README's
      # copy-pasteable `tee -a` was what broke it). A second run must be a no-op,
      # not a duplicated pacman.conf section.
      - name: Re-running is idempotent
        run: |
          set -euo pipefail
          ./bootstrap.sh
          n=$(grep -c '^\[ventulus\]' /etc/pacman.conf)
          [ "$n" -eq 1 ] \
            || { echo "::error::[ventulus] appears $n times in pacman.conf after two runs"; exit 1; }
          echo "ok: pacman.conf still has exactly one [ventulus] section"

  # bootstrap.sh must stop, with exit status 3 and nothing changed, on a machine
  # the packages cannot work on (DEC-498). Each case fakes one property of an
  # Arch container — its os-release, its CPU, its init system — so the refusal
  # under test is the only thing that can stop the script.
  bootstrap-refuses:
    name: bootstrap.sh refuses unsupported machines
    runs-on: ubuntu-latest
    container: archlinux:latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # diffutils for `cmp`, which the base image lacks; without it every
      # "pacman.conf unchanged" check fails whatever the script did.
      - name: Install fish and diffutils
        run: pacman -Syu --noconfirm --needed fish diffutils

      - name: Each unsupported machine is refused, with nothing changed
        run: |
          set -euo pipefail
          cp /etc/pacman.conf /tmp/pacman.conf.orig
          mkdir -p /run/systemd/system

          expect_refusal() {  # expect_refusal <label> <expected text> <command...>
            label=$1 want=$2
            shift 2
            rc=0
            "$@" > /tmp/out.txt 2>&1 || rc=$?
            cat /tmp/out.txt
            [ "$rc" -eq 3 ] \
              || { echo "::error::$label: exit status $rc, expected 3 (refused)"; exit 1; }
            grep -qF -- "$want" /tmp/out.txt \
              || { echo "::error::$label: the output does not say: $want"; exit 1; }
            grep -qF 'Nothing was changed.' /tmp/out.txt \
              || { echo "::error::$label: the output does not say nothing was changed"; exit 1; }
            cmp -s /etc/pacman.conf /tmp/pacman.conf.orig \
              || { echo "::error::$label: /etc/pacman.conf was modified"; exit 1; }
            [ ! -e /etc/pacman.conf.ventulus.bak ] \
              || { echo "::error::$label: a pacman.conf backup was written"; exit 1; }
            echo "ok: $label refused"
          }
          # /etc/os-release is a symlink into /usr/lib; replace the link, not its target.
          os() { rm -f /etc/os-release; printf '%s\n' "$@" > /etc/os-release; }

          os 'NAME="Manjaro Linux"' 'ID=manjaro' 'ID_LIKE=arch' 'PRETTY_NAME="Manjaro Linux"'
          expect_refusal Manjaro 'Manjaro is not supported.' bash ./bootstrap.sh
          # The documented launch from fish, CachyOS's default shell.
          expect_refusal 'Manjaro, launched from fish' 'Manjaro is not supported.' \
            fish -c 'bash ./bootstrap.sh'

          # Debian, Ubuntu (and what is built on them) and Fedora are pointed at
          # their own repositories (DEC-499).
          os 'NAME="Debian GNU/Linux"' 'ID=debian' 'PRETTY_NAME="Debian GNU/Linux 13 (trixie)"'
          expect_refusal Debian 'On Debian GNU/Linux 13 (trixie), use the APT repository.' bash ./bootstrap.sh

          os 'NAME=Ubuntu' 'ID=ubuntu' 'ID_LIKE=debian' 'PRETTY_NAME="Ubuntu 26.04 LTS"'
          expect_refusal Ubuntu 'On Ubuntu 26.04 LTS, use the APT repository.' bash ./bootstrap.sh

          os 'NAME="Linux Mint"' 'ID=linuxmint' 'ID_LIKE="ubuntu debian"' 'PRETTY_NAME="Linux Mint 22.2"'
          expect_refusal 'Linux Mint' 'On Linux Mint 22.2, use the APT repository.' bash ./bootstrap.sh
          grep -qF 'Linux Mint 22' /tmp/out.txt \
            || { echo "::error::the APT refusal does not name the unsupported Ubuntu 24.04 derivatives"; exit 1; }

          os 'NAME="Fedora Linux"' 'ID=fedora' 'PRETTY_NAME="Fedora Linux 44 (Workstation Edition)"'
          expect_refusal Fedora 'On Fedora Linux 44 (Workstation Edition), use the DNF repository.' bash ./bootstrap.sh

          # ID_LIKE=fedora is not Fedora: the DNF repository cannot serve RHEL's family.
          os 'NAME="AlmaLinux"' 'ID="almalinux"' 'ID_LIKE="rhel centos fedora"' 'PRETTY_NAME="AlmaLinux 10.0 (Purple Lion)"'
          expect_refusal AlmaLinux 'AlmaLinux 10.0 (Purple Lion) is not supported.' bash ./bootstrap.sh

          # Arch from here on, each with one machine property wrong.
          printf '#!/bin/sh\necho aarch64\n' > /usr/local/bin/uname
          chmod +x /usr/local/bin/uname
          # An Arch derivative with no ID_LIKE line (some Garuda releases) must
          # pass the distribution check: refused for the CPU, never for the distro.
          os 'NAME="Garuda Linux"' 'ID=garuda' 'PRETTY_NAME="Garuda Linux"'
          expect_refusal 'Garuda (no ID_LIKE) on aarch64' 'built for x86_64 only' bash ./bootstrap.sh
          ! grep -qF 'is not supported' /tmp/out.txt \
            || { echo "::error::Garuda without ID_LIKE was refused as a distribution"; exit 1; }
          os 'NAME="Arch Linux"' 'ID=arch' 'PRETTY_NAME="Arch Linux"'
          expect_refusal 'Arch on aarch64' 'built for x86_64 only' bash ./bootstrap.sh
          rm /usr/local/bin/uname

          rmdir /run/systemd/system
          expect_refusal 'Arch without systemd' 'not booted with systemd' bash ./bootstrap.sh

  # The README's commands are pasted into whatever shell the user runs. CachyOS
  # defaults to fish, where a heredoc, a `NAME=value` line or a bracketed
  # `(cd … && …)` is a parse error, and the install steps carried all three until
  # 2026-10-15 because nothing ran them in anything but bash.
  lint:
    name: bootstrap.sh lints; README commands parse in bash, zsh and fish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the shells and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish zsh shellcheck

      # Warning level: the one info-level note (SC2012, `ls -t` to pick the newest
      # cached package) is a deliberate, commented choice.
      - name: shellcheck bootstrap.sh
        run: shellcheck --severity=warning bootstrap.sh

      # publish.yml's own steps: a script that does not parse fails only at the
      # next release, with the repositories half-published.
      - name: shellcheck and compile the publish scripts
        run: |
          shellcheck --severity=warning -x .github/scripts/*.sh
          python3 -m py_compile .github/scripts/manifest.py

      - name: Every README command block parses in every shell
        run: |
          set -euo pipefail
          mkdir -p /tmp/blocks
          awk '
            /^```bash$/ { n++; file = sprintf("/tmp/blocks/%02d.sh", n); inside = 1; next }
            /^```$/     { inside = 0; next }
            inside      { print > file }
          ' README.md
          count=$(find /tmp/blocks -name '*.sh' | wc -l)
          [ "$count" -ge 5 ] \
            || { echo "::error::found only $count bash blocks in README.md — has the fence format changed?"; exit 1; }
          fail=0
          for f in /tmp/blocks/*.sh; do
            bash -n "$f"            || { echo "::error::README.md bash block $(basename "$f") does not parse in bash"; fail=1; }
            zsh -n "$f"             || { echo "::error::README.md bash block $(basename "$f") does not parse in zsh"; fail=1; }
            fish --no-execute "$f"  || { echo "::error::README.md bash block $(basename "$f") does not parse in fish"; fail=1; }
          done
          [ "$fail" -eq 0 ] && echo "ok: all $count README.md command blocks parse in bash, zsh and fish"
          exit "$fail"

  # The signing-key fingerprint is pinned in five places across this repo. Nothing
  # compared them, so a key rotation would have to be caught by hand in all five
  # — and a miss means either a fail-closed install (the lucky case) or a stale
  # fingerprint quietly trusted somewhere.
  fingerprint:
    name: Signing key is consistent and not near expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: All five pins agree with the key file
        run: |
          set -euo pipefail

          # The key file is the source of truth: it is what users import.
          actual=$(gpg --show-keys --with-colons keys/ventulus.gpg \
                     | awk -F: '/^fpr:/ {print $10; exit}')
          [ -n "$actual" ] || { echo "::error::could not read a fingerprint from keys/ventulus.gpg"; exit 1; }
          echo "keys/ventulus.gpg -> $actual"

          fail=0
          # keys/control-ofc.gpg is the same key under the old URL, still in
          # existing users' instructions. It must stay byte-identical.
          if ! cmp -s keys/ventulus.gpg keys/control-ofc.gpg; then
            echo "::error::keys/control-ofc.gpg differs from keys/ventulus.gpg — both URLs must serve the same key"
            fail=1
          else
            echo "ok: keys/control-ofc.gpg is identical to keys/ventulus.gpg"
          fi
          check() {  # check <label> <file> <expected-count-at-least>
            n=$(grep -c "$actual" "$2" || true)
            if [ "$n" -lt "$3" ]; then
              echo "::error::$1 ($2): expected at least $3 occurrence(s) of $actual, found $n"
              fail=1
            else
              echo "ok: $1 pins $actual ($n occurrence(s))"
            fi
          }

          # The served sections are listed three times; they must agree, and each
          # needs its key file.
          pub=$(sed -n 's/^  REPO_NAMES: //p' .github/workflows/publish.yml)
          env_list=$(sed -n 's/^  SECTIONS: //p' .github/workflows/verify.yml)
          matrix=$(sed -n 's/^        section: \[\(.*\)\]$/\1/p' .github/workflows/verify.yml | tr -d ',')
          if [ -z "$pub" ] || [ "$pub" != "$env_list" ] || [ "$pub" != "$matrix" ]; then
            echo "::error::served sections disagree: publish.yml REPO_NAMES='$pub', verify.yml SECTIONS='$env_list', verify matrix='$matrix'"
            fail=1
          else
            echo "ok: publish.yml and verify.yml both serve: $pub"
          fi
          for name in $pub; do
            [ -f "keys/${name}.gpg" ] || { echo "::error::keys/${name}.gpg is missing for section [${name}]"; fail=1; }
          done

          check "bootstrap.sh KEY_FPR"      bootstrap.sh                    1
          check "publish.yml SIGNING_KEY"   .github/workflows/publish.yml   1
          check "verify.yml SIGNING_KEY"    .github/workflows/verify.yml    1
          check "README install docs"       README.md                       2

          exit "$fail"

      # DEC-241 says in terms: "A silently expired key breaks every user's
      # `pacman -Syu` simultaneously. Rotation must happen before then." It had no
      # alarm — the consequence was written down and then left to a calendar
      # nobody keeps (register row OPEN-07a).
      #
      # This is the right home for it: verify.yml already runs daily and already
      # exists to catch things that break with nobody touching them. Failing at
      # T-90 rather than at expiry is the point — rotating a signing key,
      # re-pinning five places and getting it into users' keyrings is not a
      # same-day job, and by the time `pacman -Syu` breaks it is far too late.
      - name: Key is not approaching expiry
        run: |
          set -euo pipefail

          expiry=$(gpg --show-keys --with-colons keys/ventulus.gpg \
                     | awk -F: '/^pub:/ {print $7; exit}')
          if [ -z "$expiry" ]; then
            echo "::error::keys/ventulus.gpg has no expiry date. That is not"
            echo "::error::reassuring — it means this check cannot do its job."
            exit 1
          fi

          now=$(date -u +%s)
          days=$(( (expiry - now) / 86400 ))
          echo "signing key expires $(date -u -d "@$expiry" +%Y-%m-%d) — $days day(s) away"

          if [ "$days" -le 0 ]; then
            echo "::error::THE SIGNING KEY HAS EXPIRED. Every user's \`pacman -Syu\` is"
            echo "::error::failing right now. Rotate the key, re-pin it in all five"
            echo "::error::places, and republish."
            exit 1
          elif [ "$days" -le 90 ]; then
            echo "::error::The signing key expires in $days day(s). Rotate it NOW:"
            echo "::error::generate the new key, update keys/ventulus.gpg (and its copy keys/control-ofc.gpg), re-pin the"
            echo "::error::fingerprint in bootstrap.sh, publish.yml, verify.yml and"
            echo "::error::README.md, then republish so users pick it up before expiry."
            exit 1
          elif [ "$days" -le 180 ]; then
            echo "::warning::The signing key expires in $days day(s). Plan the rotation."
          fi

          echo "ok: $days day(s) of validity remaining"
