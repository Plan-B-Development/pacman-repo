name: Publish package repositories

# Assembles every Ventulus package repository from the latest Release of each
# source project, and the signed update manifest (DEC-241, DEC-499):
#
#   pacman  [ventulus]  assets of the rolling `repo` release (tag `repo`)
#   APT     flat repo   assets of the same release (Debian 13, Ubuntu 26.04)
#   DNF     per Fedora  GitHub Pages, rpm/fedora/<N>/x86_64/
#   ventulus-updates.json + .sig      GitHub Pages, read by the GUI's update check
#
# Two pacman databases, one set of packages. `ventulus.db` is the repository; the
# `control-ofc.db` beside it lists the same packages under the project's old
# name, so a pacman.conf that still says [control-ofc] keeps upgrading, and the
# `replaces=` in the ventulus packages carries those installs across on their
# next `pacman -Syu`. pacman names a database after its section, so a second
# database is the only way to serve both. When the transition window closes,
# drop `control-ofc` from REPO_NAMES and the next run prunes its files.
#
# The run is DECLARATIVE, not incremental: every run rebuilds everything from
# the current latest release of each source project. There is no state carried
# between runs, so the run is idempotent, has no retention logic to get wrong,
# and cannot end up advertising a package it did not upload. Re-running it is
# always safe.
#
# Signing happens here rather than in the source repos so the GPG private key
# lives in exactly one repository's secrets (DEC-241). The signature attests
# "this repository published these bytes", which is ordinary repo semantics.
#
# What it does NOT attest by itself is that the bytes came from a legitimate
# build — so the `fetch` job verifies every asset's Sigstore build provenance
# and its exact asset set before any job that holds the key starts (DEC-242).
# Signing is downstream of verification, never a substitute for it.
#
# Job order is the publication order:
#   fetch, images (no key) -> pacman, apt, dnf, manifest (sign; build artifacts only)
#   -> release (pacman + APT onto the `repo` release; no key)
#   -> pages (DNF + manifest, one atomic deployment)
# Pages deploys only after the release assets are live, so the manifest never
# announces a version that pacman or APT does not serve yet.
#
# Why `repo-add --sign` is NOT used: it shells out to gpg without loopback
# pinentry, so a passphrase-protected key cannot be used non-interactively. The
# database is built unsigned and then signed explicitly below, which is the same
# result with control over how the passphrase is supplied. The APT, DNF and
# manifest jobs hand the passphrase to gpg-agent once instead
# (.github/scripts/lib.sh), because rpmsign runs gpg itself.

on:
  workflow_dispatch:
  # Fired by the source repos once their release is published (plan step 5).
  # Payload is ignored on purpose — the run always reassembles from scratch.
  repository_dispatch:
    types: [package-released]

permissions:
  contents: read

# A simultaneous GUI + daemon release must serialise. Two concurrent runs would
# race on the release assets and one package could silently vanish from the DB.
concurrency:
  group: publish-pacman-repo
  cancel-in-progress: false

env:
  # Every name gets its own database built from the same packages (see the
  # header); order carries no meaning. Each name needs a keys/<name>.gpg copy of
  # the key, and the list must match SECTIONS and the matrix in verify.yml
  # (its `fingerprint` job checks this).
  REPO_NAMES: ventulus control-ofc
  REPO_TAG: repo
  SIGNING_KEY: 4AAD6D2DE40D0D10773BF770BC27C5EB2831FCDA

jobs:
  # Holds no key. Everything after it consumes only what it proved.
  fetch:
    name: Download and verify the Releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The GPG signatures applied downstream are the ENTIRE trust basis of
      # `SigLevel = Required`, apt's `Signed-By` and dnf's gpgcheck: each
      # installs whatever this workflow signs, silently, on every upgrade.
      # Signing an asset we never authenticated would launder a substituted or
      # compromised upload into a trusted package on every user's machine — the
      # source-repo release is downloaded over the API, but "it was attached to a
      # release" is not provenance.
      #
      # fetch.sh checks the asset set is exactly what release.yml publishes, that
      # it matches the Release's SHA256SUMS, and runs `gh attestation verify` on
      # every asset, pinned to the source repo's release.yml (--signer-workflow),
      # the Release's own tag (--source-ref) and a GitHub-hosted runner, so an
      # attestation from another workflow, a fork or another tag cannot satisfy
      # it. It also reads the daemon's API_VERSION at that tag for the manifest.
      - name: Download, check and verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch.sh verified

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified
          path: verified/
          if-no-files-found: error
          retention-days: 3

  # The containers the key-holding jobs run in, pinned by digest. A mutable tag
  # would let whoever can push that tag choose the environment the passphrase
  # and private key are handed to. Each pin lives in .github/images/<name>/Dockerfile
  # because Dependabot's docker updater bumps a FROM digest but never reads a
  # workflow's `container:`; `container:` cannot read a file, so this job does.
  # A FROM line that is not exactly `name:tag@sha256:<64 hex>` fails the run
  # before any key is used.
  images:
    name: Read the pinned images
    runs-on: ubuntu-latest
    outputs:
      archlinux: ${{ steps.pin.outputs.archlinux }}
      debian: ${{ steps.pin.outputs.debian }}
      fedora: ${{ steps.pin.outputs.fedora }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: pin
        run: bash .github/scripts/images.sh

  pacman:
    name: Build the pacman repository
    needs: [fetch, images]
    runs-on: ubuntu-latest
    container: ${{ needs.images.outputs.archlinux }}
    steps:
      # The keyring first: a pinned image is weeks old, and packages signed by
      # a packager key added since would fail `-Syu` as unknown trust. The new
      # keyring is itself signed by keys the image already trusts.
      - name: Install tooling
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed pacman-contrib

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified
          path: verified

      # Exactly the bytes fetch verified, and exactly one package per project.
      - name: Take the verified packages
        run: |
          set -euo pipefail
          (cd verified && sha256sum --strict --quiet -c verified.sha256)
          mkdir -p build
          for project in ventulusd ventulus; do
            # `ventulus-[0-9]*` cannot match `ventulusd-…`: the version starts with a digit.
            mapfile -t pkgs < <(ls -1 "verified/${project}/${project}"-[0-9]*.pkg.tar.zst)
            if [ "${#pkgs[@]}" -ne 1 ]; then
              echo "::error::expected exactly 1 ${project} package, got ${#pkgs[@]}"
              exit 1
            fi
            cp "${pkgs[0]}" build/
          done
          ls -l build/

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          # Mark it ultimately trusted so gpg will sign with it non-interactively.
          printf '%s:6:\n' "$SIGNING_KEY" | gpg --batch --import-ownertrust
          gpg --list-secret-keys --keyid-format=long

      # Each package needs its own detached signature as a sibling file: with
      # `SigLevel = Required`, pacman fetches `<pkg>.pkg.tar.zst.sig` from the
      # same Server URL. repo-add then embeds that signature into the database,
      # which is why signing must happen BEFORE repo-add runs.
      - name: Sign the packages
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd build
          for pkg in *.pkg.tar.zst; do
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --local-user "$SIGNING_KEY" \
                --detach-sign --no-armor "$pkg"
            gpg --verify "$pkg.sig" "$pkg"
          done
          ls -l

      # The bootstrap script is signed with the same release key and published as
      # a release asset alongside everything else (DEC-248). Signing it here, from
      # the checkout, is what keeps the signature in lockstep with the script: a
      # committed .sig would silently go stale the moment bootstrap.sh was edited,
      # and a stale signature on an install script fails closed for every user.
      #
      # The repo root remains the reviewable source of truth; README points users
      # at these assets so the pair they download always verifies.
      - name: Sign the bootstrap script
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cp bootstrap.sh build/
          cd build
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --local-user "$SIGNING_KEY" \
              --detach-sign --no-armor bootstrap.sh
          gpg --verify bootstrap.sh.sig bootstrap.sh

      - name: Build and sign the database
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd build
          # One database per name, each built from the same packages.
          for REPO_NAME in $REPO_NAMES; do
            repo-add "${REPO_NAME}.db.tar.gz" ./*.pkg.tar.zst

            for db in "${REPO_NAME}.db.tar.gz" "${REPO_NAME}.files.tar.gz"; do
              gpg --batch --yes --pinentry-mode loopback \
                  --passphrase "$GPG_PASSPHRASE" \
                  --local-user "$SIGNING_KEY" \
                  --detach-sign --no-armor "$db"
              gpg --verify "$db.sig" "$db"
            done

            # repo-add leaves `<repo>.db` and `<repo>.files` as SYMLINKS to the
            # .tar.gz archives. GitHub Release assets are flat files with no
            # symlink support, so uploading them verbatim ships a broken database
            # — the single most common way this setup fails. Replace them with
            # real copies. The .sig of the .tar.gz verifies the copy too, since
            # the bytes are identical.
            rm -f "${REPO_NAME}.db" "${REPO_NAME}.files"
            cp "${REPO_NAME}.db.tar.gz"        "${REPO_NAME}.db"
            cp "${REPO_NAME}.files.tar.gz"     "${REPO_NAME}.files"
            cp "${REPO_NAME}.db.tar.gz.sig"    "${REPO_NAME}.db.sig"
            cp "${REPO_NAME}.files.tar.gz.sig" "${REPO_NAME}.files.sig"

            for f in "${REPO_NAME}.db" "${REPO_NAME}.files"; do
              if [ -L "$f" ]; then
                echo "::error::$f is still a symlink — it would upload as a broken database"
                exit 1
              fi
            done
            gpg --verify "${REPO_NAME}.db.sig" "${REPO_NAME}.db"
          done
          ls -l

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pacman
          path: build/
          if-no-files-found: error
          retention-days: 3

  apt:
    name: Build the APT repository
    needs: [fetch, images]
    runs-on: ubuntu-latest
    container: ${{ needs.images.outputs.debian }}
    steps:
      - name: Install tooling
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends apt-utils gnupg gpg-agent gpgv xz-utils ca-certificates

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified
          path: verified

      - name: Build and sign the flat repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          (cd verified && sha256sum --strict --quiet -c verified.sha256)
          bash .github/scripts/apt-repo.sh verified apt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apt
          path: apt/
          if-no-files-found: error
          retention-days: 3

  dnf:
    name: Build the DNF repositories
    needs: [fetch, images]
    runs-on: ubuntu-latest
    container: ${{ needs.images.outputs.fedora }}
    steps:
      - name: Install tooling
        run: dnf -y -q install rpm-sign createrepo_c gnupg2

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified
          path: verified

      - name: Sign the packages, build and sign the metadata
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          (cd verified && sha256sum --strict --quiet -c verified.sha256)
          bash .github/scripts/dnf-repo.sh verified site

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dnf
          path: site/
          if-no-files-found: error
          retention-days: 3

  manifest:
    name: Build the update manifest
    needs: [fetch, images]
    runs-on: ubuntu-latest
    container: ${{ needs.images.outputs.debian }}
    steps:
      - name: Install tooling
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends gnupg gpg-agent gpgv python3 rpm zstd ca-certificates

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified
          path: verified

      - name: Write and sign ventulus-updates.json
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          (cd verified && sha256sum --strict --quiet -c verified.sha256)
          bash .github/scripts/manifest.sh verified manifest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest
          path: manifest/
          if-no-files-found: error
          retention-days: 3

  # pacman and APT share the `repo` release. Holds no key: everything it uploads
  # was signed and checked by the jobs above.
  release:
    name: Publish pacman + APT on the repo release
    needs: [pacman, apt, dnf, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pacman
          path: build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apt
          path: build

      - name: Publish the repository
        run: |
          set -euo pipefail
          keys=()
          for REPO_NAME in $REPO_NAMES; do
            cp "keys/${REPO_NAME}.gpg" build/
            keys+=("${REPO_NAME}.gpg")
          done
          cd build
          ls -l

          if ! gh release view "$REPO_TAG" >/dev/null 2>&1; then
            gh release create "$REPO_TAG" \
              --target "${GITHUB_SHA}" \
              --title "Ventulus package repositories" \
              --notes "Rolling repository assets. Do not delete this release — \
          it is the pacman \`Server\` and the APT \`URIs\` endpoint. Regenerated by the publish workflow."
          fi

          # PUBLICATION ORDER IS LOAD-BEARING (DEC-248).
          #
          # The previous version uploaded everything in one `--clobber` batch and
          # claimed that made them "land together". It did not. `gh release upload
          # --clobber` DELETES each existing asset before re-uploading it, and the
          # database was first in the list — so every publish opened a window in
          # which `control-ofc.db` did not exist at all while the packages it
          # points at were still being transferred. That is not theoretical:
          # verify.yml failed on `failed retrieving file 'control-ofc.db.sig' ...
          # 404` against a perfectly healthy repository on 2026-08-05.
          #
          # The indices are the POINTERS. Nothing may reference a package that is
          # not already uploaded, so:
          #   1. packages + signatures first  (referenced-by, must exist first)
          #   2. indices staged under temp names, then swapped in by RENAME
          #   3. prune superseded assets last (nothing points at them any more)
          #
          # Package filenames carry the version, so a new release adds new asset
          # names rather than replacing any — the old packages stay downloadable
          # for the whole publish and are only removed by the prune at the end,
          # once the new indices have already stopped referencing them.
          #
          # GitHub serves a REPLACED asset stale for about 90–150 s per URL once
          # that URL has been fetched (DEC-499 phase 0), which no order here can
          # avoid: in that window apt can pair a new InRelease with an old
          # Packages (a hash mismatch; apt keeps its previous lists and the next
          # `apt update` succeeds), and an old index can name a package the prune
          # removed. The user accepted that window; README documents it and
          # verify.yml waits it out.
          gh release upload "$REPO_TAG" --clobber \
            ./*.pkg.tar.zst ./*.pkg.tar.zst.sig ./*.deb \
            "${keys[@]}" bootstrap.sh bootstrap.sh.sig

          # The indices, in swap order: each pacman database before its
          # signature, and APT's InRelease last, after the Packages files and
          # Release it vouches for.
          indices=()
          for REPO_NAME in $REPO_NAMES; do
            indices+=("${REPO_NAME}.db" "${REPO_NAME}.db.sig" "${REPO_NAME}.files" "${REPO_NAME}.files.sig")
          done
          indices+=(Packages Packages.xz Release Release.gpg InRelease)

          # Stage the indices under names no client requests, so each live index
          # keeps serving the OLD (still-valid, still-complete) one for the
          # entire upload.
          staging_files=()
          for f in "${indices[@]}"; do
            cp "$f" "$f.staging"
            staging_files+=("$f.staging")
          done
          gh release upload "$REPO_TAG" --clobber "${staging_files[@]}"

          # Swap by RENAME. Renaming a release asset is a metadata-only API call,
          # so the interval where an index is absent shrinks from "however long a
          # multi-megabyte upload takes" to a few sequential PATCHes.
          #
          # Honest limit: this is EFFECTIVELY atomic, not atomic. GitHub offers no
          # transaction across assets, so a `pacman -Sy` landing inside that
          # sub-second window can still miss a file. The .db and .db.sig are
          # swapped adjacently because pacman fetches them as a pair and a new
          # database against an old signature fails SigLevel=Required.
          # ORDER INSIDE swap() MATTERS TOO: resolve and verify the staged
          # replacement BEFORE deleting the live asset. Checking afterwards
          # reads as equivalent and is not — if the staged upload silently
          # failed, deleting first leaves the repository with NO database at
          # all, which is strictly worse than the momentary 404 this whole
          # change exists to remove. Verify first and the run aborts with the
          # old, complete database still serving. Do not "tidy" the lookup
          # down to one call by moving it back after the delete.
          swap() {
            local final="$1" staged="$1.staging"
            local staged_api live_api
            staged_api=$(gh release view "$REPO_TAG" --json assets \
                           -q ".assets[] | select(.name==\"$staged\") | .apiUrl")
            if [ -z "$staged_api" ]; then
              echo "::error::staged asset $staged is missing — aborting before touching the live $final"
              exit 1
            fi
            live_api=$(gh release view "$REPO_TAG" --json assets \
                         -q ".assets[] | select(.name==\"$final\") | .apiUrl")
            if [ -n "$live_api" ]; then
              gh release delete-asset "$REPO_TAG" "$final" --yes
            fi
            gh api --method PATCH "$staged_api" -f name="$final" >/dev/null
            echo "swapped in: $final"
          }
          for f in "${indices[@]}"; do
            swap "$f"
          done

          # Retitle a release created under an older name; a no-op once it matches.
          gh release edit "$REPO_TAG" --title "Ventulus package repositories" >/dev/null

          # Prune superseded assets, LAST — by this point the freshly-swapped
          # indices no longer reference any of them, so removing them cannot
          # break an in-flight upgrade that already read the new indices.
          # Without this every past version accumulates on the release forever:
          # inert, but unbounded, and it reads as though several versions are on
          # offer.
          #
          # `.staging` names are deliberately excluded from the keep list. In the
          # normal path they no longer exist (they were renamed), but a run that
          # died mid-swap leaves one behind — excluding them here makes the next
          # successful publish self-healing.
          find . -maxdepth 1 -type f ! -name '*.staging' -printf '%f\n' > "$RUNNER_TEMP/keep.txt"
          gh release view "$REPO_TAG" --json assets -q '.assets[].name' \
            | while read -r asset; do
                if ! grep -qxF "$asset" "$RUNNER_TEMP/keep.txt"; then
                  echo "pruning superseded asset: $asset"
                  gh release delete-asset "$REPO_TAG" "$asset" --yes
                fi
              done

          {
            echo "### Published on the repo release"
            for pkg in *.pkg.tar.zst *.deb; do
              echo "- \`$pkg\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # One deployment replaces the whole site, so the DNF metadata, its packages
  # and the manifest with its signature change together. Needs Pages enabled
  # with "GitHub Actions" as the source.
  pages:
    name: Publish DNF + the update manifest on Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dnf
          path: site
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manifest
          path: site

      - name: List the site
        run: |
          find site -type f | sort
          {
            echo "### Published on Pages"
            find site -name '*.rpm' -printf '- `%P`\n' | sort
            echo "- \`ventulus-updates.json\` (+ \`.sig\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
